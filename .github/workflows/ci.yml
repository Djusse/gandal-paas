name: CI

on:
  push:
    branches: [main, integration]
  pull_request:
    branches: [main, integration]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Vérifier le format des requirements (UTF-8 / LF)
        run: |
          file requirements.txt | grep -q 'ASCII text\|UTF-8 Unicode text'
          ! grep -q $'\r' requirements.txt

      - name: Ruff
        run: ruff check app tests

      - name: Tests
        run: pytest -q

  orchestrator:
    name: Orchestrateur (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: orchestrator/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check gandal app tests gandal_deploy.py

      - name: Compilation
        run: python -m compileall -q gandal app gandal_deploy.py

      - name: Tests (dont contrats)
        run: pytest -q

  scripts:
    name: Scripts (shellcheck + syntaxe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning \
            infra/k3s/*.sh infra/aws/*.sh orchestrator/validation.sh deploy/*.sh backend/scripts/*.sh

      - name: Syntaxe Bash
        run: |
          for f in infra/k3s/*.sh infra/aws/*.sh orchestrator/validation.sh deploy/*.sh backend/scripts/*.sh; do
            bash -n "$f"
          done

  no-legacy-paths:
    name: Aucun ancien chemin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier l'absence d'anciens chemins
        run: |
          set -e
          fail=0
          for pattern in '~/tests/validation.sh' 'tests/validation.sh' 'gandal-paas/gandal_deploy.py'; do
            if git grep -n -- "$pattern" -- ':!docs' ':!*.tex' ':!.github/workflows/ci.yml'; then
              echo "Ancien chemin détecté : $pattern" >&2
              fail=1
            fi
          done
          if [ -f gandal_deploy.py ] || [ -f install.sh ] || [ -f registry.yaml ]; then
            echo "Fichier à la racine alors qu'il doit être déplacé" >&2
            fail=1
          fi
          exit "$fail"

      - name: Arborescence attendue
        run: |
          for path in backend orchestrator infra/k3s infra/aws deploy docs; do
            test -d "$path" || { echo "Dossier manquant : $path" >&2; exit 1; }
          done

  yaml:
    name: Manifestes YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Valider les manifestes
        run: |
          pip install -q PyYAML
          python - <<'PY'
          import glob
          import sys
          import yaml

          errors = []
          for path in glob.glob("infra/k3s/*.yaml") + glob.glob("deploy/*.yml"):
              try:
                  list(yaml.safe_load_all(open(path, encoding="utf-8")))
              except Exception as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("manifestes valides")
          PY

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        run: docker build -t gandal/backend:ci backend

      - name: Build orchestrateur
        run: docker build -t gandal/orchestrator:ci orchestrator

  links:
    name: Liens Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les liens internes
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(".")
          pattern = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          fence = re.compile(r"^\s*(```|~~~)")
          # Une cible de lien ne contient que ces caractères ; cela écarte les
          # expressions régulières qui ressemblent à des liens dans les tableaux.
          plausible = re.compile(r"^[\w./%~-]+$")
          errors = []

          for md in root.rglob("*.md"):
              if ".git" in md.parts:
                  continue
              in_code = False
              for lineno, line in enumerate(
                  md.read_text(encoding="utf-8", errors="ignore").splitlines(), 1
              ):
                  if fence.match(line):
                      in_code = not in_code
                      continue
                  if in_code:
                      continue
                  # Les liens en ligne (code `[...]( ... )`) ne sont pas des liens.
                  for target in pattern.findall(line):
                      if target.startswith(("http://", "https://", "mailto:", "#")):
                          continue
                      if not plausible.match(target):
                          continue
                      path = target.split("#", 1)[0]
                      if not path:
                          continue
                      if not (md.parent / path).exists():
                          errors.append(f"{md}:{lineno}: lien rompu -> {target}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("liens valides")
          PY
