# Ingress public de l'API du backend.
#
# Le domaine dépend de l'IP publique : install-gandal.sh remplace
# PLACEHOLDER_DOMAIN avant application. Ne pas appliquer tel quel.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: gandal-system
spec:
  ingressClassName: traefik
  rules:
    - host: api.PLACEHOLDER_DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
